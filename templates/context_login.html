<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Context Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css', v='20260328-responsive-tuning') }}">
    <style>
        .context-shell {
            max-width: 420px;
            margin: 4rem auto;
            padding: 1.5rem;
        }
        .context-shell h1 {
            font-size: 1.1rem;
            letter-spacing: 0.08em;
            margin-bottom: 1rem;
        }
        .context-shell label {
            display: block;
            font-size: 0.8rem;
            letter-spacing: 0.06em;
            margin-bottom: 0.4rem;
        }
        .context-shell input[type="password"] {
            width: 100%;
            padding: 0.7rem 0.8rem;
            border: 1px solid #ddd;
            margin-bottom: 1rem;
            font-size: 1rem;
        }
        .context-shell button {
            border: 1px solid #222;
            background: #222;
            color: #fff;
            padding: 0.65rem 1rem;
            letter-spacing: 0.08em;
            cursor: pointer;
        }
        .context-error {
            color: #a11;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <main class="context-shell">
        <h1>PERSONAL CONTEXT</h1>
        {% if error %}
        <p class="context-error">{{ error }}</p>
        {% endif %}
        <form method="post" action="{{ url_for('context_login') }}">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Unlock</button>
        </form>
    </main>
</body>
</html>
