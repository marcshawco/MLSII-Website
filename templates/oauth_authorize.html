<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Authorize Context Access</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css', v='20260328-responsive-tuning') }}">
    <style>
        .oauth-shell {
            max-width: 460px;
            margin: 4rem auto;
            padding: 1.5rem;
        }
        .oauth-shell h1 {
            font-size: 1.1rem;
            letter-spacing: 0.08em;
            margin-bottom: 0.75rem;
        }
        .oauth-shell p {
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 1rem;
            letter-spacing: 0.02em;
        }
        .oauth-shell label {
            display: block;
            font-size: 0.8rem;
            letter-spacing: 0.06em;
            margin-bottom: 0.4rem;
        }
        .oauth-shell select,
        .oauth-shell input[type="password"] {
            width: 100%;
            padding: 0.7rem 0.8rem;
            border: 1px solid #ddd;
            margin-bottom: 1rem;
            font-size: 1rem;
        }
        .oauth-shell button {
            border: 1px solid #222;
            background: #222;
            color: #fff;
            padding: 0.65rem 1rem;
            letter-spacing: 0.08em;
            cursor: pointer;
        }
        .oauth-error {
            color: #a11;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
        .client-name {
            font-weight: 600;
        }
    </style>
</head>
<body>
    <main class="oauth-shell">
        <h1>AUTHORIZE ACCESS</h1>
        <p>
            <span class="client-name">{{ client_name }}</span> wants read/write access to your
            shared AI memory. Everything it writes will be attributed to the assistant you choose below.
        </p>
        {% if error %}
        <p class="oauth-error">{{ error }}</p>
        {% endif %}
        <form method="post" action="{{ url_for('oauth_authorize') }}">
            <input type="hidden" name="client_id" value="{{ client_id }}">
            <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}">
            <input type="hidden" name="state" value="{{ state }}">
            <input type="hidden" name="scope" value="{{ scope }}">
            <input type="hidden" name="code_challenge" value="{{ code_challenge }}">
            <input type="hidden" name="code_challenge_method" value="{{ code_challenge_method }}">
            <label for="peer">This connection is for</label>
            <select id="peer" name="peer" required>
                <option value="" {{ 'selected' if not selected_peer }} disabled>Choose an assistant</option>
                {% for p in peers %}
                <option value="{{ p }}" {{ 'selected' if p == selected_peer }}>{{ p|capitalize }}</option>
                {% endfor %}
            </select>
            <label for="password">Context password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
            <button type="submit">Allow</button>
        </form>
    </main>
</body>
</html>
